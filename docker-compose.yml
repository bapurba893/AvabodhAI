services:
  db:
    image: pgvector/pgvector:pg16
    container_name: avabodh_db
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME:-avabodh}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: apurbapm/avabodhai-api:latest
    container_name: avabodh_api
    restart: on-failure
    ports:
      - "4000:8000"
      - "8000:8000"
    environment:
      LLM_PROVIDER:         ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY:       ${OPENAI_API_KEY}
      OLLAMA_BASE_URL:      ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL:    ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      MAP_MODEL:            ${MAP_MODEL:-gpt-4o-mini}
      REDUCE_MODEL:         ${REDUCE_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL:      ${EMBEDDING_MODEL:-text-embedding-3-small}
      DB_HOST:              db
      DB_PORT:              5432
      DB_NAME:              ${DB_NAME:-avabodh}
      DB_USER:              ${DB_USER:-postgres}
      DB_PASSWORD:          ${DB_PASSWORD}
      DOCUMENTS_DIR:        ./documents
      MIN_CHUNK_SIZE:       ${MIN_CHUNK_SIZE:-100}
      MAX_CHUNK_SIZE:       ${MAX_CHUNK_SIZE:-3000}
      SUMMARY_MAX_LENGTH:   ${SUMMARY_MAX_LENGTH:-2000}
      SUMMARY_LANGUAGE:     ${SUMMARY_LANGUAGE:-English}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_ENDPOINT:   ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      LANGCHAIN_API_KEY:    ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT:    ${LANGCHAIN_PROJECT:-Avabodh Project}
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
      LOG_FILE:             avabodh.log
      PYTHONIOENCODING:     utf-8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploaded_files:/app/uploaded_files
      - kb_uploaded_files:/app/kb_uploaded_files
      - documents:/app/documents
    healthcheck:
      disable: true

volumes:
  postgres_data:
  uploaded_files:
  kb_uploaded_files:
  documents:
