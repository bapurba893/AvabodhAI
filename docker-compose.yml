services:
  db:
    image: pgvector/pgvector:pg16
    container_name: avabodh_db
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME:-avabodh}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: apurbapm/avabodhai-api:latest
    container_name: avabodh_api
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY:       ${OPENAI_API_KEY}
      MAP_MODEL:            ${MAP_MODEL:-gpt-4o-mini}
      REDUCE_MODEL:         ${REDUCE_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL:      ${EMBEDDING_MODEL:-text-embedding-3-small}
      DB_HOST:              db
      DB_PORT:              5432
      DB_NAME:              ${DB_NAME:-avabodh}
      DB_USER:              ${DB_USER:-postgres}
      DB_PASSWORD:          ${DB_PASSWORD}
      DOCUMENTS_DIR:        ./documents
      MIN_CHUNK_SIZE:       ${MIN_CHUNK_SIZE:-100}
      MAX_CHUNK_SIZE:       ${MAX_CHUNK_SIZE:-3000}
      SUMMARY_MAX_LENGTH:   ${SUMMARY_MAX_LENGTH:-2000}
      SUMMARY_LANGUAGE:     ${SUMMARY_LANGUAGE:-English}
      VISION_MODEL:         ${VISION_MODEL:-gpt-4o}
      IMAGE_MIN_SIZE_BYTES: ${IMAGE_MIN_SIZE_BYTES:-5000}
      IMAGE_MAX_DIMENSION:  ${IMAGE_MAX_DIMENSION:-1024}
      IMAGE_MAX_WORKERS:    ${IMAGE_MAX_WORKERS:-4}
      # SECRET_KEY signs the document preview file links (GET /documents/{id}/file).
      # The Python-level default is deliberately an obvious placeholder — set a
      # real value here (or in .env) before any production deployment, or the
      # API logs a loud warning on startup and preview links stay forgeable.
      SECRET_KEY:            ${SECRET_KEY:-dev-only-CHANGE-ME-in-production}
      FILE_LINK_TTL_SECONDS: ${FILE_LINK_TTL_SECONDS:-900}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_ENDPOINT:   ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      LANGCHAIN_API_KEY:    ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT:    ${LANGCHAIN_PROJECT:-Avabodh Project}
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
      LOG_FILE:             avabodh.log
      PYTHONIOENCODING:     utf-8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploaded_files:/app/uploaded_files
      - documents:/app/documents
    healthcheck:
      disable: true

volumes:
  postgres_data:
  uploaded_files:
  documents: